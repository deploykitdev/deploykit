id: mysql
name: MySQL
image: mysql:8
icon_url: https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg
ports:
  - container_port: 3306
    protocol: tcp
env_vars:
  - { key: MYSQL_DATABASE, value: app }
  - { key: MYSQL_USER, value: app }
  - { key: MYSQL_PASSWORD, generate: password_24 }
  - { key: MYSQL_ROOT_PASSWORD, generate: password_24 }
