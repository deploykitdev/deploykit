root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags dev -o ./tmp/deploykitd ./cmd/deploykitd"
  bin = "./tmp/deploykitd"
  include_ext = ["go"]
  exclude_dir = ["tmp", "dist", "frontend", "http/spa_assets", "docs"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true
