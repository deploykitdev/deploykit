version: 2

project_name: deploykit

before:
  hooks:
    - go mod tidy
    # Build the SPA so it can be embedded into the binary.
    - sh -c "cd frontend && npm ci && npm run build"
    - sh -c "rm -rf http/spa_assets/dist && cp -r frontend/build/client http/spa_assets/dist"

builds:
  - id: deploykitd
    binary: deploykitd
    main: ./cmd/deploykitd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: deploykitd
    ids:
      - deploykitd
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*
      - install.sh

checksum:
  name_template: "checksums.txt"

# Sign the checksums file once with cosign keyless (Sigstore + GitHub OIDC).
# Every artifact is then transitively verifiable: install.sh checks the
# signature on checksums.txt, then matches each tarball against its sha256.
# Keyless mode means no long-lived signing key to manage or rotate — the
# certificate is issued by Fulcio against the GitHub Actions OIDC token.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: deploykitdev
    name: deploykit
  draft: false
  prerelease: auto
  header: |
    ## DeployKit {{ .Tag }}

    Install on a fresh Linux VM:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/deploykitdev/deploykit/{{ .Tag }}/install.sh | sudo bash
    ```
